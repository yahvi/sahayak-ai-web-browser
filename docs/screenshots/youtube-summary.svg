<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="yt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="url(#yt-bg)" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>
  
  <!-- Browser Header Bar -->
  <rect x="20" y="20" width="760" height="40" rx="12" fill="#1e293b"/>
  <circle cx="44" cy="40" r="5" fill="#ef4444"/>
  <circle cx="60" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="76" cy="40" r="5" fill="#10b981"/>
  <rect x="110" y="28" width="400" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="125" y="44" fill="#94a3b8" font-size="11">https://www.youtube.com/watch?v=dQw4w9WgXcQ</text>

  <!-- YouTube Video Player Mock (Left) -->
  <rect x="35" y="75" width="415" height="240" rx="8" fill="#000000" stroke="#334155" stroke-width="1"/>
  <circle cx="242" cy="195" r="30" fill="rgba(239, 68, 68, 0.9)"/>
  <polygon points="235,182 256,195 235,208" fill="#ffffff"/>

  <!-- Progress bar -->
  <rect x="45" y="295" width="395" height="4" rx="2" fill="#475569"/>
  <rect x="45" y="295" width="160" height="4" rx="2" fill="#ef4444"/>
  <circle cx="205" cy="297" r="5" fill="#ef4444"/>

  <!-- Video Details -->
  <text x="45" y="340" fill="#f8fafc" font-size="15" font-weight="700">Deep Learning Crash Course (Full 45-min Lecture)</text>
  <text x="45" y="360" fill="#94a3b8" font-size="11">TechAcademy • 1.2M views • 2 weeks ago</text>
  <rect x="45" y="380" width="120" height="24" rx="12" fill="#1e293b"/>
  <text x="65" y="396" fill="#f8fafc" font-size="10" font-weight="600">👍 45K  |  Share</text>

  <!-- Sahayak Side Panel (Right) -->
  <rect x="465" y="75" width="300" height="385" rx="8" fill="#fffdf9" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Panel Top Bar -->
  <rect x="465" y="75" width="300" height="42" rx="8" fill="#f6f3ee"/>
  <text x="480" y="101" fill="#1c1917" font-size="15" font-weight="800" letter-spacing="-0.5">Sahayak <tspan font-weight="400" fill="#78716c">सहायक</tspan></text>
  
  <rect x="680" y="85" width="70" height="22" rx="11" fill="#e7e0d6"/>
  <rect x="682" y="87" width="32" height="18" rx="9" fill="#0f766e"/>
  <text x="691" y="100" fill="#ffffff" font-size="9" font-weight="700">EN</text>
  <text x="720" y="100" fill="#78716c" font-size="9" font-weight="600">HI</text>

  <!-- Grounding Tag for YouTube -->
  <rect x="475" y="125" width="280" height="24" rx="4" fill="#fee2e2" stroke="#fecaca" stroke-width="0.8"/>
  <text x="485" y="141" fill="#dc2626" font-size="10" font-weight="700">🎬 YouTube: Deep Learning Crash Course</text>

  <!-- Chapters Header -->
  <text x="480" y="172" fill="#1c1917" font-size="12" font-weight="700">Video Chapters (Click to Seek)</text>
  <text x="480" y="188" fill="#78716c" font-size="9.5">Grounding via Gemini 2.5 Flash Native Video</text>

  <!-- Chapter Seek Pills -->
  <!-- Chapter 1 -->
  <g cursor="pointer">
    <rect x="475" y="200" width="280" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="483" y="208" width="50" height="22" rx="4" fill="#0f766e"/>
    <text x="491" y="223" fill="#ffffff" font-size="9.5" font-weight="700">▶ 00:00</text>
    <text x="542" y="223" fill="#0f172a" font-size="10.5" font-weight="600">Introduction &amp; Perceptrons</text>
  </g>

  <!-- Chapter 2 -->
  <g cursor="pointer">
    <rect x="475" y="246" width="280" height="38" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="483" y="254" width="50" height="22" rx="4" fill="#0f766e"/>
    <text x="491" y="269" fill="#ffffff" font-size="9.5" font-weight="700">▶ 08:35</text>
    <text x="542" y="269" fill="#0f766e" font-size="10.5" font-weight="700">Backpropagation Calculus</text>
  </g>

  <!-- Chapter 3 -->
  <g cursor="pointer">
    <rect x="475" y="292" width="280" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="483" y="300" width="50" height="22" rx="4" fill="#0f766e"/>
    <text x="491" y="315" fill="#ffffff" font-size="9.5" font-weight="700">▶ 21:10</text>
    <text x="542" y="315" fill="#0f172a" font-size="10.5" font-weight="600">Activation Functions (ReLU vs GELU)</text>
  </g>

  <!-- Chapter 4 -->
  <g cursor="pointer">
    <rect x="475" y="338" width="280" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="483" y="346" width="50" height="22" rx="4" fill="#0f766e"/>
    <text x="491" y="361" fill="#ffffff" font-size="9.5" font-weight="700">▶ 34:45</text>
    <text x="542" y="361" fill="#0f172a" font-size="10.5" font-weight="600">Optimization &amp; AdamW Benchmark</text>
  </g>

  <!-- Chapter 5 -->
  <g cursor="pointer">
    <rect x="475" y="384" width="280" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="483" y="392" width="50" height="22" rx="4" fill="#0f766e"/>
    <text x="491" y="407" fill="#ffffff" font-size="9.5" font-weight="700">▶ 42:00</text>
    <text x="542" y="407" fill="#0f172a" font-size="10.5" font-weight="600">Summary &amp; Project Assignment</text>
  </g>

  <!-- Bottom Notice -->
  <rect x="475" y="430" width="280" height="20" rx="4" fill="#f1f5f9"/>
  <text x="485" y="444" fill="#64748b" font-size="9">💡 Clicking a timestamp automatically seeks video tab to that second.</text>
</svg>

