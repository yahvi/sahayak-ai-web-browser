<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow6)"/>
  
  <text x="50" y="55" fill="#f8fafc" font-size="18" font-weight="800">Settings, Profile Memory &amp; Security Rails</text>
  <text x="50" y="75" fill="#94a3b8" font-size="11.5">Zero remote tracking. All API keys and user profile facts are stored locally in chrome.storage.local.</text>

  <!-- Settings Grid (Left: Keys & Config) -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="335" height="340" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="18" y="28" fill="#0f766e" font-size="13" font-weight="700">API Keys &amp; Models</text>

    <!-- Gemini Key -->
    <text x="18" y="58" fill="#334155" font-size="11" font-weight="600">Gemini API Key (Required)</text>
    <rect x="18" y="66" width="299" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="86" fill="#0f172a" font-size="11">AIzaSyB*****************************</text>
    <text x="18" y="108" fill="#64748b" font-size="9.5">Stored in browser local storage; never committed to git.</text>

    <!-- Groq Key -->
    <text x="18" y="136" fill="#334155" font-size="11" font-weight="600">Groq API Key (Optional Fallback)</text>
    <rect x="18" y="144" width="299" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="164" fill="#64748b" font-size="11">gsk_********************************</text>
    <text x="18" y="186" fill="#64748b" font-size="9.5">Used for fast text fallback when primary hits 429.</text>

    <!-- Language -->
    <text x="18" y="214" fill="#334155" font-size="11" font-weight="600">Default Output Language</text>
    <rect x="18" y="222" width="299" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="242" fill="#0f172a" font-size="11">English / Hinglish (Bilingual Output)</text>

    <!-- Save Button -->
    <rect x="18" y="275" width="299" height="36" rx="6" fill="#0f766e"/>
    <text x="120" y="298" fill="#ffffff" font-size="12" font-weight="700">Save Settings</text>
  </g>

  <!-- Settings Grid (Right: Profile & Allowlist) -->
  <g transform="translate(415, 100)">
    <rect x="0" y="0" width="335" height="340" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="18" y="28" fill="#0f766e" font-size="13" font-weight="700">Local Memory &amp; Allowlist</text>

    <!-- Profile Memory -->
    <text x="18" y="58" fill="#334155" font-size="11" font-weight="600">User Profile Memory (Free-form text)</text>
    <rect x="18" y="66" width="299" height="74" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="85" fill="#334155" font-size="10.5">Name: John Doe</text>
    <text x="28" y="101" fill="#334155" font-size="10.5">Email: john.doe@university.edu</text>
    <text x="28" y="117" fill="#334155" font-size="10.5">College: IIT Delhi, Computer Science</text>
    <text x="28" y="131" fill="#334155" font-size="10.5">Track: Full Stack AI Systems</text>

    <!-- Extra Allowlist -->
    <text x="18" y="166" fill="#334155" font-size="11" font-weight="600">Custom Allowlist Hosts (One per line)</text>
    <rect x="18" y="174" width="299" height="54" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="193" fill="#334155" font-size="10.5">localhost</text>
    <text x="28" y="209" fill="#334155" font-size="10.5">127.0.0.1</text>
    <text x="28" y="223" fill="#334155" font-size="10.5">internal-portal.corp</text>

    <!-- Denylist override notice -->
    <rect x="18" y="240" width="299" height="42" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="26" y="257" fill="#991b1b" font-size="10" font-weight="700">🛡️ Denylist Primacy Rule:</text>
    <text x="26" y="271" fill="#b91c1c" font-size="9.5">Banking and checkout URLs are always blocked.</text>

    <text x="28" y="310" fill="#64748b" font-size="10">Saved skills row allows reusable 1-click prompts.</text>
  </g>
</svg>

