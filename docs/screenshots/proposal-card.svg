<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow5)"/>
  
  <text x="50" y="55" fill="#f8fafc" font-size="18" font-weight="800">Human-in-the-Loop Browser Agent Proposals</text>
  <text x="50" y="75" fill="#94a3b8" font-size="11.5">Every action is proposed with rationale; execution requires explicit approval. High-impact steps require double confirmation.</text>

  <!-- Left Card: Standard Approved Step -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="335" height="340" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="335" height="44" rx="10" fill="#f8fafc"/>
    <rect x="16" y="12" width="60" height="20" rx="10" fill="#0f766e"/>
    <text x="24" y="26" fill="#ffffff" font-size="10" font-weight="700">Step 1 of 4</text>
    
    <rect x="85" y="12" width="50" height="20" rx="10" fill="#e0f2fe"/>
    <text x="96" y="26" fill="#0369a1" font-size="10" font-weight="700">TYPE</text>

    <!-- Body -->
    <text x="18" y="75" fill="#64748b" font-size="11">PROPOSED ACTION</text>
    <rect x="18" y="85" width="299" height="52" rx="6" fill="#f1f5f9"/>
    <text x="28" y="106" fill="#0f172a" font-size="12" font-weight="700">Type "John Doe"</text>
    <text x="28" y="124" fill="#475569" font-size="11">Target: [1] input "Full Name"</text>

    <text x="18" y="160" fill="#64748b" font-size="11">MODEL RATIONALE</text>
    <text x="18" y="180" fill="#1e293b" font-size="11.5">"Fill applicant's legal name using stored</text>
    <text x="18" y="196" fill="#1e293b" font-size="11.5">local profile memory for internship goal."</text>

    <line x1="18" y1="218" x2="317" y2="218" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Action Buttons -->
    <rect x="18" y="235" width="299" height="36" rx="6" fill="#0f766e"/>
    <text x="110" y="258" fill="#ffffff" font-size="12" font-weight="700">✓ Approve Step 1</text>

    <g transform="translate(18, 282)">
      <rect x="0" y="0" width="144" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="45" y="21" fill="#475569" font-size="11" font-weight="600">Skip Field</text>

      <rect x="155" y="0" width="144" height="32" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="195" y="21" fill="#dc2626" font-size="11" font-weight="700">🛑 Stop (Kill)</text>
    </g>
  </g>

  <!-- Right Card: Consequential Double Confirmation Step -->
  <g transform="translate(415, 100)">
    <rect x="0" y="0" width="335" height="340" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="335" height="44" rx="10" fill="#fef2f2"/>
    <rect x="16" y="12" width="60" height="20" rx="10" fill="#991b1b"/>
    <text x="24" y="26" fill="#ffffff" font-size="10" font-weight="700">Step 4 of 4</text>
    
    <rect x="85" y="12" width="55" height="20" rx="10" fill="#fee2e2"/>
    <text x="96" y="26" fill="#b91c1c" font-size="10" font-weight="700">CLICK</text>

    <rect x="150" y="12" width="105" height="20" rx="10" fill="#fee2e2"/>
    <text x="158" y="26" fill="#b91c1c" font-size="10" font-weight="700">⚠️ Consequential</text>

    <!-- Consequential Alert Box -->
    <rect x="18" y="60" width="299" height="60" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="28" y="80" fill="#991b1b" font-size="11" font-weight="700">⚠️ Extra Confirmation Required:</text>
    <text x="28" y="96" fill="#b91c1c" font-size="10">This looks like Submit, Pay, or Send.</text>
    <text x="28" y="110" fill="#b91c1c" font-size="10">Confirm again to execute DOM action.</text>

    <!-- Body -->
    <text x="18" y="142" fill="#64748b" font-size="11">PROPOSED ACTION</text>
    <rect x="18" y="152" width="299" height="44" rx="6" fill="#f8fafc"/>
    <text x="28" y="171" fill="#0f172a" font-size="12" font-weight="700">Click [4] button "Submit Application"</text>
    <text x="28" y="186" fill="#475569" font-size="10.5">Final form dispatch</text>

    <!-- Double Confirm Button -->
    <rect x="18" y="210" width="299" height="40" rx="6" fill="#b91c1c"/>
    <text x="75" y="235" fill="#ffffff" font-size="12" font-weight="800">⚠️ Confirm &amp; Execute (Click)</text>

    <!-- Secondary Actions -->
    <g transform="translate(18, 262)">
      <rect x="0" y="0" width="144" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="45" y="21" fill="#475569" font-size="11" font-weight="600">Skip Field</text>

      <rect x="155" y="0" width="144" height="32" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="195" y="21" fill="#dc2626" font-size="11" font-weight="700">🛑 Stop (Kill)</text>
    </g>

    <text x="24" y="320" fill="#64748b" font-size="9.5">Dry-Run mode simulates highlight without clicking.</text>
  </g>
</svg>

