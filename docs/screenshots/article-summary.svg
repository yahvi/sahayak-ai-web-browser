<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="url(#bg)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Browser Header Bar -->
  <rect x="20" y="20" width="760" height="40" rx="12" fill="#1e293b"/>
  <circle cx="44" cy="40" r="5" fill="#ef4444"/>
  <circle cx="60" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="76" cy="40" r="5" fill="#10b981"/>
  <rect x="110" y="28" width="400" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="125" y="44" fill="#94a3b8" font-size="11">https://tech-journal.org/quantum-computing-breakthrough</text>

  <!-- Webpage Area (Left) -->
  <rect x="35" y="75" width="415" height="385" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="55" y="110" fill="#f8fafc" font-size="18" font-weight="700">Quantum Advantage in Silicon</text>
  <text x="55" y="130" fill="#64748b" font-size="11">By Dr. Arvind Patel • 6 min read</text>
  
  <rect x="55" y="150" width="375" height="6" rx="3" fill="#334155"/>
  <rect x="55" y="165" width="350" height="6" rx="3" fill="#334155"/>
  <rect x="55" y="180" width="365" height="6" rx="3" fill="#334155"/>
  <rect x="55" y="195" width="300" height="6" rx="3" fill="#334155"/>

  <rect x="55" y="225" width="375" height="70" rx="6" fill="#1e293b"/>
  <text x="70" y="255" fill="#94a3b8" font-size="11">Researchers demonstrated coherence times exceeding 2 milliseconds</text>
  <text x="70" y="275" fill="#94a3b8" font-size="11">in standard silicon-28 CMOS manufacturing nodes.</text>

  <rect x="55" y="315" width="375" height="6" rx="3" fill="#334155"/>
  <rect x="55" y="330" width="340" height="6" rx="3" fill="#334155"/>
  <rect x="55" y="345" width="360" height="6" rx="3" fill="#334155"/>

  <!-- Sahayak Side Panel (Right) -->
  <rect x="465" y="75" width="300" height="385" rx="8" fill="#fffdf9" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Panel Top Bar -->
  <rect x="465" y="75" width="300" height="42" rx="8" fill="#f6f3ee"/>
  <text x="480" y="101" fill="#1c1917" font-size="15" font-weight="800" letter-spacing="-0.5">Sahayak <tspan font-weight="400" fill="#78716c">सहायक</tspan></text>
  
  <!-- Language Toggle Button -->
  <rect x="680" y="85" width="70" height="22" rx="11" fill="#e7e0d6"/>
  <rect x="682" y="87" width="32" height="18" rx="9" fill="#0f766e"/>
  <text x="691" y="100" fill="#ffffff" font-size="9" font-weight="700">EN</text>
  <text x="720" y="100" fill="#78716c" font-size="9" font-weight="600">HI</text>

  <!-- Panel Tabs -->
  <line x1="465" y1="140" x2="765" y2="140" stroke="#e7e0d6" stroke-width="1"/>
  <rect x="475" y="120" width="55" height="20" rx="10" fill="#0f766e"/>
  <text x="485" y="134" fill="#ffffff" font-size="10" font-weight="600">Summary</text>
  <text x="545" y="134" fill="#78716c" font-size="10" font-weight="500">Chat</text>
  <text x="590" y="134" fill="#78716c" font-size="10" font-weight="500">Act</text>
  <text x="630" y="134" fill="#78716c" font-size="10" font-weight="500">Ask</text>
  <text x="670" y="134" fill="#78716c" font-size="10" font-weight="500">Settings</text>

  <!-- Grounding Tag -->
  <rect x="475" y="152" width="280" height="22" rx="4" fill="#ccfbf1" stroke="#99f6e4" stroke-width="0.8"/>
  <text x="485" y="167" fill="#0f766e" font-size="10" font-weight="600">📄 Grounded in current article</text>

  <!-- Summary Content Card -->
  <rect x="475" y="185" width="280" height="255" rx="8" fill="#ffffff" stroke="#e7e0d6" stroke-width="1"/>
  <text x="490" y="210" fill="#0f766e" font-size="12" font-weight="700">Key Takeaways</text>
  
  <!-- Bullet 1 -->
  <circle cx="495" cy="235" r="3" fill="#0f766e"/>
  <text x="507" y="238" fill="#1c1917" font-size="10.5" font-weight="600">Silicon Coherence Record:</text>
  <text x="507" y="253" fill="#44403c" font-size="10">Demonstrated 2ms coherence on standard</text>
  <text x="507" y="267" fill="#44403c" font-size="10">CMOS silicon-28 semiconductor nodes.</text>

  <!-- Bullet 2 -->
  <circle cx="495" cy="292" r="3" fill="#0f766e"/>
  <text x="507" y="295" fill="#1c1917" font-size="10.5" font-weight="600">Scalable Fabrication:</text>
  <text x="507" y="310" fill="#44403c" font-size="10">Enables leveraging existing multi-billion</text>
  <text x="507" y="324" fill="#44403c" font-size="10">dollar semiconductor fab equipment.</text>

  <!-- Bullet 3 -->
  <circle cx="495" cy="349" r="3" fill="#0f766e"/>
  <text x="507" y="352" fill="#1c1917" font-size="10.5" font-weight="600">Cryogenic Control:</text>
  <text x="507" y="367" fill="#44403c" font-size="10">Integrated control electronics operate at</text>
  <text x="507" y="381" fill="#44403c" font-size="10">1 Kelvin without thermal decoherence.</text>

  <!-- Bottom Action -->
  <rect x="487" y="405" width="256" height="24" rx="6" fill="#f6f3ee" stroke="#e7e0d6"/>
  <text x="550" y="421" fill="#78716c" font-size="10" font-weight="600">💬 Ask follow-up question...</text>
</svg>

