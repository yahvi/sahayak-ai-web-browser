<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="menuShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow3)"/>
  
  <!-- Browser Header Bar -->
  <rect x="20" y="20" width="760" height="40" rx="12" fill="#1e293b"/>
  <circle cx="44" cy="40" r="5" fill="#ef4444"/>
  <circle cx="60" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="76" cy="40" r="5" fill="#10b981"/>
  <rect x="110" y="28" width="400" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="125" y="44" fill="#94a3b8" font-size="11">https://learn.org/intro-to-algorithms/sorting</text>

  <!-- Webpage Area with Selection (Left) -->
  <rect x="35" y="75" width="415" height="385" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="55" y="110" fill="#f8fafc" font-size="16" font-weight="700">QuickSort Average vs Worst Case</text>
  
  <text x="55" y="145" fill="#cbd5e1" font-size="12">QuickSort operates by selecting a 'pivot' element</text>
  <text x="55" y="165" fill="#cbd5e1" font-size="12">from the array and partitioning other elements.</text>

  <!-- Highlighted / Selected text -->
  <rect x="52" y="185" width="375" height="42" rx="3" fill="#0369a1" fill-opacity="0.6"/>
  <text x="55" y="202" fill="#ffffff" font-size="12" font-weight="500">The average time complexity is O(n log n), while</text>
  <text x="55" y="220" fill="#ffffff" font-size="12" font-weight="500">the worst-case performance degrades to O(n²).</text>

  <!-- Context Menu Popup -->
  <g transform="translate(180, 230)" filter="url(#menuShadow)">
    <rect x="0" y="0" width="210" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    
    <g transform="translate(0, 10)">
      <rect x="6" y="0" width="198" height="28" rx="4" fill="#f0fdfa"/>
      <text x="24" y="18" fill="#0f766e" font-size="11" font-weight="600">⚡ Explain this with Sahayak</text>
    </g>
    
    <g transform="translate(0, 42)">
      <text x="24" y="18" fill="#334155" font-size="11">🌐 Translate selection</text>
    </g>

    <g transform="translate(0, 74)">
      <text x="24" y="18" fill="#334155" font-size="11">✉️ Draft a reply</text>
    </g>
  </g>

  <!-- Sahayak Side Panel Chat (Right) -->
  <rect x="465" y="75" width="300" height="385" rx="8" fill="#fffdf9" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Panel Top Bar -->
  <rect x="465" y="75" width="300" height="42" rx="8" fill="#f6f3ee"/>
  <text x="480" y="101" fill="#1c1917" font-size="15" font-weight="800">Sahayak Chat</text>
  
  <rect x="680" y="85" width="70" height="22" rx="11" fill="#e7e0d6"/>
  <rect x="718" y="87" width="32" height="18" rx="9" fill="#0f766e"/>
  <text x="691" y="100" fill="#78716c" font-size="9" font-weight="600">EN</text>
  <text x="726" y="100" fill="#ffffff" font-size="9" font-weight="700">HI</text>

  <!-- Chat Messages -->
  <!-- User Query Bubble -->
  <g transform="translate(540, 130)">
    <rect x="0" y="0" width="215" height="36" rx="8" fill="#0f766e"/>
    <text x="12" y="18" fill="#ffffff" font-size="10" font-weight="600">Explain selection:</text>
    <text x="12" y="30" fill="#ccfbf1" font-size="9.5">"The average time complexity..."</text>
  </g>

  <!-- Assistant Streaming Reply Bubble (Hinglish output enabled) -->
  <g transform="translate(475, 180)">
    <rect x="0" y="0" width="280" height="180" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="12" y="22" fill="#0f766e" font-size="11" font-weight="700">Sahayak (Hinglish mode)</text>
    
    <text x="12" y="44" fill="#1e293b" font-size="10.5" font-weight="600">Grounded in page context:</text>
    <text x="12" y="64" fill="#334155" font-size="10">QuickSort mein jab pivot array ko almost</text>
    <text x="12" y="80" fill="#334155" font-size="10">barabar do hisson mein baant-ta hai,</text>
    <text x="12" y="96" fill="#334155" font-size="10">toh speed <tspan font-weight="700">O(n log n)</tspan> hoti hai (average case).</text>
    
    <text x="12" y="122" fill="#334155" font-size="10">Lekin agar pivot already sorted array ka</text>
    <text x="12" y="138" fill="#334155" font-size="10">sabse chhota/bada element chuna jaye,</text>
    <text x="12" y="154" fill="#334155" font-size="10">toh partition fail hokar <tspan font-weight="700">O(n²)</tspan> ban jata hai. ▌</text>
  </g>

  <!-- Chat Input Bar -->
  <rect x="475" y="375" width="280" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="488" y="396" fill="#94a3b8" font-size="10">Ask anything grounded in this page...</text>
  <rect x="715" y="380" width="34" height="24" rx="4" fill="#0f766e"/>
  <text x="724" y="396" fill="#ffffff" font-size="11" font-weight="700">→</text>

  <!-- Quick Action Pill below input -->
  <rect x="475" y="420" width="90" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="484" y="435" fill="#475569" font-size="9.5">📷 Ask screen</text>

  <rect x="575" y="420" width="95" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="584" y="435" fill="#475569" font-size="9.5">⚡ Summarize</text>
</svg>

