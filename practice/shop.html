<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sahayak Practice — Shop Search & Filters</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: #1e293b;
      background-color: #f8fafc;
    }
    body {
      max-width: 720px;
      margin: 40px auto;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #0f172a;
    }
    p.desc {
      color: #64748b;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .search-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.92rem;
    }
    .search-btn {
      background: #0f766e;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      align-items: center;
    }
    .category-select {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .product-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      background: #f8fafc;
    }
    .product-title {
      font-weight: 600;
      margin-bottom: 4px;
    }
    .product-price {
      color: #0f766e;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .add-btn {
      width: 100%;
      background: #ffffff;
      color: #0f766e;
      border: 1px solid #0f766e;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .add-btn:hover {
      background: #0f766e;
      color: #ffffff;
    }
    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: #0f766e;
      text-decoration: none;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <h1>Practice Campus Store</h1>
  <p class="desc">Practice page for item search, category filtering, and item selection.</p>

  <div class="search-bar">
    <input type="text" id="store-search" class="search-input" placeholder="Search books, stationery, or hoodies..." />
    <button type="button" id="search-submit" class="search-btn">Search</button>
  </div>

  <div class="filters">
    <label for="category-filter">Category:</label>
    <select id="category-filter" class="category-select">
      <option value="all">All Departments</option>
      <option value="books">Textbooks</option>
      <option value="electronics">Electronics</option>
      <option value="merch">Campus Merch</option>
    </select>
  </div>

  <div class="product-grid">
    <div class="product-card">
      <div class="product-title">Data Structures in C++</div>
      <div class="product-price">₹450</div>
      <button type="button" id="btn-buy-ds" class="add-btn">Add to Cart</button>
    </div>
    <div class="product-card">
      <div class="product-title">Scientific Calculator</div>
      <div class="product-price">₹850</div>
      <button type="button" id="btn-buy-calc" class="add-btn">Add to Cart</button>
    </div>
    <div class="product-card">
      <div class="product-title">Campus Hoodie (Navy)</div>
      <div class="product-price">₹1,200</div>
      <button type="button" id="btn-buy-hoodie" class="add-btn">Add to Cart</button>
    </div>
  </div>

  <a href="index.html" class="back-link">← Back to Practice Pages</a>
</body>
</html>
